<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Maura Laundry</title>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0d6efd11,#6610f211);text-align:center;padding:1rem}
    .box{max-width:400px}
    .icon{font-size:4rem;margin-bottom:1rem;opacity:.5}
    h1{font-size:1.5rem;margin:0 0 .5rem;color:#333}
    p{color:#666;margin:0 0 1.5rem}
    button{background:#0d6efd;color:#fff;border:none;padding:.75rem 1.5rem;border-radius:.5rem;font-size:1rem;cursor:pointer;font-weight:600}
    button:hover{background:#0b5ed7}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Periksa koneksi internet Anda dan coba lagi.</p>
    <button onclick="location.reload()">Muat Ulang</button>
  </div>
</body>
</html>
